spring.application.name=OnmyojiGuess

# 接口报错时在响应体中返回具体错误信息 (如 400 校验提示)
spring.web.error.include-message=always

# ---------------- MySQL 8.0 数据源 ----------------
# createDatabaseIfNotExist=true: 库不存在时自动创建
spring.datasource.url=jdbc:mysql://localhost:3306/guess?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# TODO: 修改为你的 MySQL 密码
spring.datasource.password=2324960123qq

# 启动时自动执行建表脚本 (幂等, 可重复执行)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init.sql

# ---------------- 采集调度 ----------------
# 应用启动完成后是否立即执行一次采集 (补漏 + 预热缓存) 第一次启动建议开启
app.fetch.run-on-startup=false

# ---------------- AI 判定 (Spring AI, OpenAI 兼容协议 -> DeepSeek) ----------------
# AI 提供方切换: deepseek(默认, V4.1-Flash 批量判定) | startlux(StartLux-Decision 单帖概率决策)
app.ai.provider=startlux
# 送入 AI 的正文截断上限(字符), 对所有 AI 实现全局通用
app.ai.max-text-len=3000

# 切换其他 OpenAI 兼容模型(如 Kimi/Qwen/GLM)只需修改 base-url / model / api-key
spring.ai.openai.base-url=https://api.deepseek.com
# V4.1-Flash 的 API 模型名 (2026-09-10 发布)
spring.ai.openai.chat.model=deepseek-flash
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.temperature=0.1
# API Key 从环境变量 DEEPSEEK_API_KEY 注入, 配置文件中不落明文 (启动前需设置环境变量)
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:}

# ---------------- StartLux-Decision 配置 (app.ai.provider=startlux 时生效) ----------------
app.ai.startlux.base-url=http://192.168.1.46:8090
# 方向 choice 置信度低于该值时保守判为非押注贴 (参考文档建议 0.55)
app.ai.startlux.min-confidence=0.55
