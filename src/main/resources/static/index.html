<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阴阳师对弈竞猜 · 当前对局式神</title>
<style>
  :root {
    --bg: #14161d;
    --card: #1d2029;
    --border: #2c3040;
    --text: #d8dbe4;
    --muted: #7b8194;
    --red: #e05a5a;
    --blue: #4a8fe0;
    --gold: #d8b25c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    padding: 20px;
  }
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 { font-size: 20px; color: var(--gold); letter-spacing: 2px; }
  .round-info {
    display: inline-flex; gap: 14px; margin-top: 10px; padding: 6px 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--muted);
  }
  .round-info b { color: var(--text); font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .side-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .side-title { padding: 10px 16px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--border); }
  .side-title.red { color: var(--red); border-left: 4px solid var(--red); }
  .side-title.blue { color: var(--blue); border-left: 4px solid var(--blue); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 10px; text-align: center; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; background: rgba(255,255,255,.03); }
  td { border-top: 1px solid var(--border); }
  td.name { font-weight: 600; min-width: 110px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); font-size: 14px; }
  .footer { text-align: center; margin-top: 14px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="header">
  <h1>阴阳师对弈竞猜 · 当前对局式神</h1>
  <div class="round-info" id="roundInfo">加载中...</div>
</div>
<div class="grid">
  <div class="side-card">
    <div class="side-title red">红方 (左)</div>
    <div id="redBox"></div>
  </div>
  <div class="side-card">
    <div class="side-title blue">蓝方 (右)</div>
    <div id="blueBox"></div>
  </div>
</div>
<div class="footer" id="footer"></div>

<script>
const REFRESH_MS = 60000;

function escapeHtml(s) {
  return s == null ? '' : String(s).replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function roundText(roundNo) {
  const start = 8 + 2 * roundNo;
  return `第${roundNo}场 · ${start}:00-${start + 2}:00`;
}

function sideTable(units) {
  if (!units || units.length === 0) {
    return '<div class="empty">暂无数据, 等待 OCR 上报</div>';
  }
  const rows = units.map(u => `
    <tr>
      <td>${u.no}</td>
      <td class="name">${escapeHtml(u.name) || '-'}</td>
      <td>${escapeHtml(u.attack)}</td>
      <td>${escapeHtml(u.hp)}</td>
      <td>${escapeHtml(u.defense)}</td>
      <td>${escapeHtml(u.speed)}</td>
      <td>${escapeHtml(u.critRate)}</td>
      <td>${escapeHtml(u.critDamage)}</td>
      <td>${escapeHtml(u.effectHit)}</td>
      <td>${escapeHtml(u.effectResist)}</td>
      <td>${escapeHtml(u.mitama) || '-'}</td>
    </tr>`).join('');
  return `
    <table>
      <thead>
        <tr>
          <th>座位</th><th>式神</th><th>攻击</th><th>生命</th><th>防御</th>
          <th>速度</th><th>暴击</th><th>暴伤</th><th>命中</th><th>抵抗</th><th>御魂</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function load() {
  try {
    const res = await fetch('/api/guess/shikigami/current');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('roundInfo').innerHTML =
        `<span>日期 <b>${escapeHtml(data.roundDate)}</b></span>` +
        `<span><b>${roundText(data.roundNo)}</b></span>`;
    document.getElementById('redBox').innerHTML = sideTable(data.red);
    document.getElementById('blueBox').innerHTML = sideTable(data.blue);
    document.getElementById('footer').textContent =
        `每 ${REFRESH_MS / 1000} 秒自动刷新 · 上次更新 ${new Date().toLocaleTimeString('zh-CN')}`;
  } catch (e) {
    document.getElementById('footer').textContent = '加载失败: ' + e.message;
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
